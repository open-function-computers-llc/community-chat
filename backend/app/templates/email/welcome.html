<!-- Welcome email (sent at registration). Filled by email.py::welcome_html.
     The GREETING tag is plain text ("Welcome, Dana! ..." or "Welcome! ..."). -->
<tr>
  <td style="padding: 20px 28px 12px;">
    <div style="font-size: 18px; font-weight: bold;">Welcome to %%BRAND%%</div>
  </td>
</tr>
<tr>
  <td style="padding: 0 28px 8px;">
    <p style="margin: 0;">%%GREETING%%</p>
  </td>
</tr>
<tr>
  <td style="padding: 16px 28px;">
    <a href="%%APP_URL%%" target="_blank" style="display: inline-block; background: #4f46e5; color: #ffffff; text-decoration: none; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: bold;">Open the app</a>
  </td>
</tr>

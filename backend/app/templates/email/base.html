<!-- Shared frame for every Community Chat transactional email. Child content
     (header row, body rows, optional button row) is injected at the EMAIL_BODY
     tag below, from the templates in this folder. See app/routers/email.py
     (::_merge) for the placeholder mechanics. NOTE: never write a literal
     percent-delimited merge tag inside a template comment — string
     replacement fills comments too and the injected fragment can break the
     surrounding markup. -->
<html>
  <head>
    <meta name="x-apple-disable-message-reformatting" />
  </head>
  <body style="margin: 0; padding: 0; background: #f4f5f7; font-family: Arial, Helvetica, sans-serif; color: #1c1e21;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f4f5f7; padding: 24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width: 600px; width: 100%; background: #ffffff; border-radius: 12px; overflow: hidden;">
            %%EMAIL_BODY%%
            <tr>
              <td style="padding: 20px; text-align: center; color: #9aa0a6; font-size: 12px;">
                <p style="margin: 0;">
                  Community Chat &middot; you're getting this because you turned on email
                  notifications.<br />
                  Manage or stop them in Settings.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

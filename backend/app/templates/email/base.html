<!-- Shared frame for every Community Chat transactional email. Child content
     (header row, body rows, optional button row) is injected at the EMAIL_BODY
     tag below, from the templates in this folder, and the one-line audience
     explanation is injected at the FOOTER tag (a partials/footer_*.html file
     chosen per email by audience — see app/routers/email.py ::_frame).
     See app/routers/email.py (::_merge) for the placeholder mechanics; it
     strips HTML comments before filling tags, so comments like this one are
     authoring documentation only and never ship inside the email. -->
<html>
  <head>
    <meta name="x-apple-disable-message-reformatting" />
  </head>
  <body style="margin: 0; padding: 0; background: #f4f5f7; font-family: Arial, Helvetica, sans-serif; color: #1c1e21;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f4f5f7; padding: 24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width: 600px; width: 100%; background: #ffffff; border-radius: 12px; overflow: hidden;">
            <!-- Brand masthead: the unDraw family illustration, injected by
                 _frame as an inline CID image (attached per message by
                 _send_smtp). Empty when the asset file is missing. -->
            <tr>
              <td align="center">%%BRAND_IMG%%</td>
            </tr>
            %%EMAIL_BODY%%
            <tr>
              <td style="padding: 20px; text-align: center; color: #9aa0a6; font-size: 12px;">
                <p style="margin: 0;">%%FOOTER%%</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

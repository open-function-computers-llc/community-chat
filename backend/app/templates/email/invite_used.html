<!-- "Your invite was used" notice, sent to the admin who created an invite
     when someone registers with it. Filled by email.py::invite_used_html.
     The FAMILY_BLOCK tag is either empty or the partials/invite_family.html
     fragment. -->
<tr>
  <td style="padding: 20px 28px 12px;">
    <div style="font-size: 18px; font-weight: bold;">Your invite was used</div>
  </td>
</tr>
<tr>
  <td style="padding: 0 28px 8px;">
    <p style="margin: 0;">
      Hey %%CREATOR_NAME%%, %%JOINER_NAME%% just joined %%BRAND%% using an
      invite you created.
    </p>
    %%FAMILY_BLOCK%%
  </td>
</tr>
<tr>
  <td style="padding: 16px 28px;">
    <a href="%%APP_URL%%" target="_blank" style="display: inline-block; background: #4f46e5; color: #ffffff; text-decoration: none; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: bold;">Open Community Chat</a>
  </td>
</tr>

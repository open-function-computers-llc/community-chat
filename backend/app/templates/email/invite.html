<!-- Invite email. Filled by email.py::invite_html. The FAMILY_BLOCK tag is
     either empty or the partials/invite_family.html fragment. -->
<tr>
  <td style="padding: 20px 28px 12px;">
    <div style="font-size: 18px; font-weight: bold;">You're invited</div>
  </td>
</tr>
<tr>
  <td style="padding: 0 28px 8px;">
    <p style="margin: 0;">Hey %%RECIPIENT_NAME%%, you've been invited to join Community Chat.</p>
    <p style="margin: 16px 0 4px; font-size: 13px; color: #5f6368;">Invite code</p>
    <p style="margin: 0 0 8px; font-family: monospace; font-size: 20px; font-weight: bold; letter-spacing: 0.1em;">%%CODE%%</p>
    %%FAMILY_BLOCK%%
  </td>
</tr>
<tr>
  <td style="padding: 16px 28px;">
    <a href="%%LINK%%" target="_blank" style="display: inline-block; background: #4f46e5; color: #ffffff; text-decoration: none; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: bold;">Join Community Chat</a>
  </td>
</tr>

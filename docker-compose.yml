services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Short git SHA shown in the app footer. Computed on the host at build
        # time (see README / deploy notes). Falls back to "unknown".
        APP_GIT_HASH: ${APP_GIT_HASH:-unknown}
    image: community-chat:latest
    container_name: community-chat
    # The host port is configurable via PORT in a .env file (default 8983).
    ports:
      - "${PORT:-8983}:8983"
    environment:
      - PORT=8983
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
      - FRONTEND_DIR=/app/frontend_dist
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
      # Web Push (VAPID) — optional; push is disabled without these.
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_EMAIL=${VAPID_EMAIL:-mailto:admin@example.com}
      # Public origin of the site, used as the VAPID audience / deep-link base.
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost:8983}
      # Transactional email (SMTP). In dev these point at the local Mailpit
      # sink (see .env.local). In production override with your provider
      # (e.g. Resend): SMTP_HOST=smtp.resend.com SMTP_PORT=587
      # SMTP_USERNAME=SMTP_PASSWORD=SMTP_FROM_ADDRESS=... SMTP_FROM_NAME=...
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Community Chat}
    volumes:
      # The SQLite DB lives in the project root under ./data so it's easy to
      # find and inspect (e.g. open ./data/chat.db). Bind-mounted at /app/data
      # inside the container (DATA_DIR). The container runs as uid 1000
      # (appuser), so the file must be owned/writable by uid 1000 — on most
      # hosts that's your normal user.
      - ./data:/app/data
      # Uploaded files (avatars, message attachments) live in ./uploads at the
      # project root so they're easy to find/inspect. Bind-mounted at
      # /app/uploads (UPLOAD_DIR). Same uid-1000 ownership note as ./data.
      - ./uploads:/app/uploads
    restart: unless-stopped

  # Local email sink (dev only). The app points its SMTP client here so
  # transactional email (invite, welcome, message notifications) is captured
  # and inspectable in the web UI at http://localhost:3025 instead of leaving
  # the machine. Not used in production — there the app talks to a real
  # transactional provider over SMTP.
  mailpit:
    image: axllent/mailpit:latest
    container_name: community-chat-mailpit
    ports:
      - "3025:8025" # web UI -> host port 3025
      - "1025:1025" # SMTP sink -> host port 1025 (app connects here)
    volumes:
      # Persist captured messages across container restarts.
      - ./mailpit:/mailpit
    restart: unless-stopped
